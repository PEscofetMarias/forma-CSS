name: Build compiled CSS

on:
  push:
    branches: [main]
    paths:
      - "scss/**"
      - ".github/workflows/build-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Sass
        run: |
          npm install --no-save sass
          npx sass --style=compressed scss/forma-css.scss css/forma-css.min.css
          npx sass --style=compressed scss/forma-css-core.scss css/forma-css-core.min.css

      - name: Commit compiled CSS if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css
          if git diff --cached --quiet; then
            echo "Compiled CSS is up to date."
          else
            git commit -m "chore: rebuild compiled CSS"
            git push
            echo "Compiled CSS updated and pushed."
          fi
